sample_sheet: ".test/config/samples.tsv"

binning:
  tools:
    - comebin
    - semibin2
    - metabat2
    - metabinner
  comebin:
    extra: ""
  metabinner:
    install_path: ""
    min_contig_length: 1000
    scale: "large"
  semibin2:
    environment: "global"
    sequencing_type: "short_read"
    extra: ""
  metabat2:
    min_contig_length: 1500
    seed: 1
    extra: ""

refinement:
  enabled: true
  method: "das_tool"
  euk_source_tool: "metabat2"
  das_tool:
    score_threshold: 0.5
    threads: 2

domain_separation:
  fallback_domain: "unknown"
  tiara:
    extra: ""
